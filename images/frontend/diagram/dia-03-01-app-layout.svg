<?xml version="1.0" encoding="UTF-8"?>
<!-- AppLayout の構造（03 章）。単純な長方形の配置なので、SVG を、直接書いている（build.sh の対象外） -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="15">
  <rect x="10" y="10" width="620" height="310" rx="14" fill="#f4f4f4" stroke="#555" stroke-width="1.6"/>
  <text x="320" y="36" text-anchor="middle" font-weight="bold" font-size="16" fill="#222">メインレイアウト（AppLayout）</text>
  <!-- 左：メニュー -->
  <rect x="30" y="52" width="150" height="250" rx="12" fill="#d6eaf8" stroke="#555" stroke-width="1.6"/>
  <text x="105" y="170" text-anchor="middle" fill="#222">左：メニュー</text>
  <text x="105" y="192" text-anchor="middle" fill="#222">SideNav</text>
  <!-- 右：ビューの内容 -->
  <rect x="200" y="52" width="410" height="250" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="1.6"/>
  <text x="405" y="76" text-anchor="middle" font-weight="bold" fill="#222">右：ビューの内容</text>
  <rect x="216" y="92" width="378" height="56" rx="10" fill="#d6eaf8" stroke="#555" stroke-width="1.6"/>
  <text x="405" y="116" text-anchor="middle" fill="#222">上のバー</text>
  <text x="405" y="136" text-anchor="middle" fill="#222">題名・ユーザー名・ログアウト</text>
  <rect x="216" y="160" width="378" height="130" rx="10" fill="#d5f5e3" stroke="#555" stroke-width="1.6"/>
  <text x="405" y="216" text-anchor="middle" fill="#222">ビュー</text>
  <text x="405" y="238" text-anchor="middle" fill="#222">学生一覧ビュー など</text>
</svg>
