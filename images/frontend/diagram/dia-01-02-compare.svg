<?xml version="1.0" encoding="UTF-8"?>
<!-- 画面を作る 3 つの方式の比較（01 章）。単純な長方形の配置なので、SVG を、直接書いている（build.sh の対象外） -->
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" viewBox="0 0 700 390" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- Vaadin Flow -->
  <rect x="10" y="10" width="680" height="110" rx="14" fill="#d5f5e3" stroke="#555" stroke-width="1.6"/>
  <text x="26" y="34" font-weight="bold" font-size="15" fill="#222">Vaadin Flow（サーバーサイド UI）</text>
  <rect x="60" y="52" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="155" y="76" text-anchor="middle" fill="#222">ブラウザ</text><text x="155" y="96" text-anchor="middle" fill="#222">（表示のみ）</text>
  <rect x="450" y="52" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="545" y="76" text-anchor="middle" fill="#222">サーバー</text><text x="545" y="96" text-anchor="middle" fill="#222">画面＋処理</text>
  <line x1="254" y1="80" x2="446" y2="80" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="350" y="72" text-anchor="middle" fill="#222">自動の通信</text>
  <!-- Thymeleaf -->
  <rect x="10" y="140" width="680" height="110" rx="14" fill="#d6eaf8" stroke="#555" stroke-width="1.6"/>
  <text x="26" y="164" font-weight="bold" font-size="15" fill="#222">Thymeleaf（テンプレートエンジン）</text>
  <rect x="60" y="182" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="155" y="215" text-anchor="middle" fill="#222">ブラウザ</text>
  <rect x="450" y="182" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="545" y="206" text-anchor="middle" fill="#222">サーバー</text><text x="545" y="226" text-anchor="middle" fill="#222">HTML を作って返す</text>
  <line x1="254" y1="200" x2="446" y2="200" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="350" y="193" text-anchor="middle" fill="#222">リクエスト</text>
  <line x1="446" y1="222" x2="254" y2="222" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="350" y="240" text-anchor="middle" fill="#222">HTML</text>
  <!-- SPA + REST -->
  <rect x="10" y="270" width="680" height="110" rx="14" fill="#fff3cd" stroke="#555" stroke-width="1.6"/>
  <text x="26" y="294" font-weight="bold" font-size="15" fill="#222">SPA ＋ REST API</text>
  <rect x="60" y="312" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="155" y="336" text-anchor="middle" fill="#222">ブラウザ</text><text x="155" y="356" text-anchor="middle" fill="#222">画面（JavaScript）</text>
  <rect x="450" y="312" width="190" height="56" rx="10" fill="#fff" stroke="#555" stroke-width="1.4"/>
  <text x="545" y="336" text-anchor="middle" fill="#222">サーバー</text><text x="545" y="356" text-anchor="middle" fill="#222">データのみ</text>
  <line x1="254" y1="340" x2="446" y2="340" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="350" y="332" text-anchor="middle" fill="#222">JSON</text>
</svg>
